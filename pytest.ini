[pytest]
testpaths = tests smartdashboard
markers =
    no_contract_guard: testet lämnar med flit data som inte följer kontraktet (contracts/), vakten i tests/contract_guard.py hoppas över
    no_planner_input_guard: testet ger planeringen med flit ofullständig eller konstig indata (minimala bilspecar, testnycklar), bara indatakontrollen i tests/contract_guard.py hoppas över
