# docker-compose.yml för EnergyWizard (LXC på NUC)
# Skapad: 2026-04-09
# Syfte: Central kontroll av värmepump, elbilar och spabad med Peak Shaving.

services:
  ####################################################################
  # Databas: PostgreSQL
  ####################################################################
  postgres-smartbox:
    image: postgres:15-alpine
    container_name: postgres-smartbox
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ####################################################################
  # Adminer: Webbgränssnitt för Databasen
  ####################################################################
  adminer:
    image: adminer
    container_name: adminer-smartbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:8780:8080"
    depends_on:
      - postgres-smartbox

  ####################################################################
  # Smartbox: Värmepumpsstyrning (Hjärnan)
  ####################################################################
  smartbox:
    image: ghcr.io/murre87/energywizard-smartbox:latest   # byggs av GitHub vid push och hämtas av Watchtower
    build: ./smartbox
    labels:
      - com.centurylinklabs.watchtower.enable=true
    container_name: smartbox
    restart: unless-stopped
    depends_on:
      postgres-smartbox:
        condition: service_healthy
    volumes:
      # EnergyWizard Open: husets drivrutins-config. Emil kör sin egna (emil_house.yaml,
      # redan verifierad mot riktiga drivrutiner i tests/test_config_loader.py) - en annan
      # installation pekar HOUSE_CONFIG_PATH mot sin egen kopia av house_config.example.yaml.
      - ${HOUSE_CONFIG_HOST_PATH:-./config/examples/emil_house.yaml}:/house_config.yaml:ro
      # Webbens inställningar (/data/energywizard.json: elpris och avgifter, batteriets stil, språk ...) delas av
      # motorn, webben och appen. Förut låg filen bara i webbcontainern och försvann vid varje uppdatering.
      - ew_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=postgres-smartbox
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - HA_IP=${HA_IP}
      - HA_URL=${HA_URL:-}
      - HA_TOKEN=${HA_TOKEN}
      - PUMP_IP=${PUMP_IP}
      - PUMP_IP_FALLBACK=${PUMP_IP_FALLBACK:-}
      - NIBE_LOCAL_HOST=${NIBE_LOCAL_HOST:-}
      - NIBE_LOCAL_PORT=${NIBE_LOCAL_PORT:-8443}
      - NIBE_LOCAL_USERNAME=${NIBE_LOCAL_USERNAME:-}
      - NIBE_LOCAL_PASSWORD=${NIBE_LOCAL_PASSWORD:-}
      - NIBE_LOCAL_TLS_PIN_SHA256=${NIBE_LOCAL_TLS_PIN_SHA256:-}
      - HOUSE_CONFIG_PATH=/house_config.yaml
      - PRICE_SOURCE=${PRICE_SOURCE:-elprisetjustnu}
      - NORDPOOL_HA_ENTITY=${NORDPOOL_HA_ENTITY:-sensor.nordpool}
      - NOTIFY_TARGET=${NOTIFY_TARGET:-}

  ####################################################################
  # EnergyWizard Mobil: lätt mobilsida (PWA) för laddning. Nås på /m/ (nginx)
  ####################################################################
  ewapp:
    image: ghcr.io/murre87/energywizard-ewapp:latest   # byggs av GitHub vid push och hämtas av Watchtower
    build:
      context: ./ewapp
      args:
        APP_VERSION: ${APP_VERSION:-local}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    container_name: ewapp
    restart: unless-stopped
    env_file:
      - ${DASHBOARD_ENV_PATH:-./secrets/dashboard.env}
    volumes:
      - ./smartbox:/smartbox:ro
      - ${HOUSE_CONFIG_HOST_PATH:-./config/examples/emil_house.yaml}:/house_config.yaml:ro   # bilarna och laddboxarna ur installationen
      - ew_data:/data
    depends_on:
      postgres-smartbox:
        condition: service_healthy
    environment:
      - HOUSE_CONFIG_PATH=/house_config.yaml
      - PYTHONUNBUFFERED=1
      # Samma priskälla som motorn och webben - annars räknar appen totalpris och besparing med fel moms
      - PRICE_SOURCE=${PRICE_SOURCE:-elprisetjustnu}
      - NORDPOOL_HA_ENTITY=${NORDPOOL_HA_ENTITY:-sensor.nordpool}
      - POSTGRES_HOST=postgres-smartbox
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - HA_IP=${HA_IP}
      - HA_URL=${HA_URL:-}
      - HA_TOKEN=${HA_TOKEN}

  ####################################################################
  # Webdashboard: ny dator-/surfplatte-dashboard (EnergyWizard Open Fas A-F),
  # ersatte Streamlit-dashboarden (borttagen 2026-11-07). profiles gör den valfri att starta - en
  # vanlig "docker compose up -d" (utan --profile) rör den inte alls, så den
  # kan utvecklas/testas utan att påverka den körande produktionen.
  ####################################################################
  webdashboard:
    image: ghcr.io/murre87/energywizard-webdashboard:latest   # byggs av GitHub vid push och hämtas av Watchtower
    build: ./webdashboard
    labels:
      - com.centurylinklabs.watchtower.enable=true
    container_name: webdashboard
    restart: unless-stopped
    profiles: ["webdashboard"]
    env_file:
      - ${DASHBOARD_ENV_PATH:-./secrets/dashboard.env}
    ports:
      - "8503:8503"
    volumes:
      - ./smartbox:/smartbox:ro
      - ew_data:/data
      # Entitetsväljarens "Spara och starta": skrivbar bara när install.sh satt HOUSE_CONFIG_MODE=rw
      # och HOUSE_CONFIG_WRITABLE=1. Annars läsbar, och väljaren erbjuder bara nedladdning.
      - ${HOUSE_CONFIG_HOST_PATH:-./config/examples/emil_house.yaml}:/house_config.yaml:${HOUSE_CONFIG_MODE:-ro}
    depends_on:
      postgres-smartbox:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=postgres-smartbox
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - HA_IP=${HA_IP}
      - HA_URL=${HA_URL:-}
      - HA_TOKEN=${HA_TOKEN}
      # System-sidan frågar Watchtowers HTTP-API om nya versioner finns för ALLA
      # containrar på NUC:en - watchtower delar docker-nät med den här stacken.
      - WATCHTOWER_API_TOKEN=${WATCHTOWER_API_TOKEN}
      - WATCHTOWER_URL=http://watchtower:8080
      # Bara på utvecklarens server: telemetrisamlarens sammanställning visas på System-sidan (antal aktiva +
      # utrustning). Tom = inget kort. T.ex. http://telemetry-collector:8504/api/stats
      - TELEMETRY_STATS_URL=${TELEMETRY_STATS_URL:-}
      # #265: kommaseparerade användarnamn (EW_USERS …:family) som får se flottvyn Installationer
      - TELEMETRY_ADMIN_USERS=${TELEMETRY_ADMIN_USERS:-}
      # Samma priskälla som motorn, så att Inställningar -> Elpris visar den som faktiskt används
      - PRICE_SOURCE=${PRICE_SOURCE:-elprisetjustnu}
      - NORDPOOL_HA_ENTITY=${NORDPOOL_HA_ENTITY:-sensor.nordpool}
      - TELEMETRY_STATS_TOKEN=${TELEMETRY_STATS_TOKEN:-}
      - HOUSE_CONFIG_PATH=/house_config.yaml
      - HOUSE_CONFIG_WRITABLE=${HOUSE_CONFIG_WRITABLE:-}

  ####################################################################
  # HA-gateway: valfri reverse-proxy som slår ihop EnergyWizard (/energywizard,
  # /energywizard/mobil, /tablet) med din befintliga Home Assistant under SAMMA
  # adress/port. Bara för Container-installationer UTAN Supervisor - har du
  # Home Assistant OS/Supervised, använd HA:s egen Ingress istället (enklare,
  # säkrare, HA hanterar auth åt dig). Se kunskapsbanken för hela guiden,
  # inklusive varför själva portbytet på din RIKTIGA HA alltid görs manuellt
  # av dig i HA:s Inställningar - den här tjänsten rör aldrig HA:s egen config.
  # "docker compose --profile ha-gateway up -d" - rörs annars inte alls.
  ####################################################################
  ha-gateway:
    image: nginx:alpine
    container_name: ha-gateway
    restart: unless-stopped
    profiles: ["ha-gateway"]
    ports:
      - "${HA_GATEWAY_PORT:-8199}:8199"
    volumes:
      - ./ha-gateway/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./ha-gateway/print-url.sh:/docker-entrypoint.d/99-print-url.sh:ro
      - ${HA_GATEWAY_CERT_DIR:-./secrets/ha-gateway-certs}:/certs:ro
    environment:
      - DOMAIN=${HA_GATEWAY_DOMAIN}
      - HA_HOST=${HA_GATEWAY_UPSTREAM_HOST}
      - HA_PORT=${HA_GATEWAY_UPSTREAM_PORT:-8123}
      - HA_PROTO=${HA_GATEWAY_UPSTREAM_PROTO:-https}
      - GATEWAY_PORT=${HA_GATEWAY_PORT:-8199}

  ####################################################################
  # Telemetri-samlare: EN instans Emil själv driftsätter - inte något varje
  # betatestare kör lokalt. Alla installationer skickar hit (obligatorisk
  # telemetri sedan 2026-11-06, se smartbox/telemetry.py och README).
  # "docker compose --profile telemetry-collector up -d" - rörs annars inte alls.
  ####################################################################
  telemetry-collector:
    build: ./telemetry-collector
    container_name: telemetry-collector
    restart: unless-stopped
    profiles: ["telemetry-collector"]
    ports:
      - "${TELEMETRY_COLLECTOR_PORT:-8504}:8504"
    volumes:
      - telemetry_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - TELEMETRY_DB_PATH=/data/telemetry.sqlite3
      - STATS_TOKEN=${TELEMETRY_STATS_TOKEN:-}   # satt: statistiken kräver nyckeln (webdashboard skickar den)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}

volumes:
  postgres_data:
  telemetry_data:
  ew_data:
