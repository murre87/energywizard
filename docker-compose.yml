# docker-compose.yml för EnergyWizard (LXC på NUC)
# Skapad: 2026-04-09
# Syfte: Central kontroll av värmepump, elbilar och spabad med Peak Shaving.

services:
  ####################################################################
  # Databas: PostgreSQL
  ####################################################################
  postgres-smartbox:
    image: postgres:15-alpine
    container_name: postgres-smartbox
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ####################################################################
  # Adminer: Webbgränssnitt för Databasen
  ####################################################################
  adminer:
    image: adminer
    container_name: adminer-smartbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:8780:8080"
    depends_on:
      - postgres-smartbox

  ####################################################################
  # Smartbox: Värmepumpsstyrning (Hjärnan)
  ####################################################################
  smartbox:
    image: ghcr.io/murre87/energywizard-smartbox:latest   # byggs av GitHub vid push och hämtas av Watchtower
    build: ./smartbox
    labels:
      - com.centurylinklabs.watchtower.enable=true
    container_name: smartbox
    restart: unless-stopped
    depends_on:
      postgres-smartbox:
        condition: service_healthy
    volumes:
      # EnergyWizard Open: husets drivrutins-config. Emil kör sin egna (emil_house.yaml,
      # redan verifierad mot riktiga drivrutiner i tests/test_config_loader.py) - en annan
      # installation pekar HOUSE_CONFIG_PATH mot sin egen kopia av house_config.example.yaml.
      - ${HOUSE_CONFIG_HOST_PATH:-./config/examples/emil_house.yaml}:/house_config.yaml:ro
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=postgres-smartbox
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - HA_IP=${HA_IP}
      - HA_TOKEN=${HA_TOKEN}
      - PUMP_IP=${PUMP_IP}
      - EASEE_CHARGER_ID=${EASEE_CHARGER_ID}
      - EASEE_CARPORT_ID=${EASEE_CARPORT_ID}
      - HOUSE_CONFIG_PATH=/house_config.yaml
      - PRICE_SOURCE=${PRICE_SOURCE:-elprisetjustnu}
      - NORDPOOL_HA_ENTITY=${NORDPOOL_HA_ENTITY:-sensor.nordpool}

  ####################################################################
  # Dashboard: Streamlit (Den Visuella "Glassmorphism" Frontenden)
  ####################################################################
  smartdashboard:
    image: ghcr.io/murre87/energywizard-smartdashboard:latest   # byggs av GitHub vid push och hämtas av Watchtower
    build: ./smartdashboard
    labels:
      - com.centurylinklabs.watchtower.enable=true
    container_name: smartdashboard
    restart: unless-stopped
    env_file:
      - ${DASHBOARD_ENV_PATH:-./secrets/dashboard.env}   # gemensamt DASHBOARD_PASSWORD för alla dashboards
    ports:
      - "8501:8501"
    volumes:
      # Delad logik mellan backend och frontend
      - ./smartbox:/smartbox
    depends_on:
      postgres-smartbox:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=postgres-smartbox
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - HA_IP=${HA_IP}
      - HA_TOKEN=${HA_TOKEN}
      - PRICE_SOURCE=${PRICE_SOURCE:-elprisetjustnu}

  ####################################################################
  # EnergyWizard Mobil: lätt mobilsida (PWA) för laddning, bredvid Streamlit. Nås på /m/ (nginx)
  ####################################################################
  ewapp:
    image: ghcr.io/murre87/energywizard-ewapp:latest   # byggs av GitHub vid push och hämtas av Watchtower
    build:
      context: ./ewapp
      args:
        APP_VERSION: ${APP_VERSION:-local}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    container_name: ewapp
    restart: unless-stopped
    env_file:
      - ${DASHBOARD_ENV_PATH:-./secrets/dashboard.env}
    volumes:
      - ./smartbox:/smartbox:ro
    depends_on:
      postgres-smartbox:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=postgres-smartbox
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - HA_IP=${HA_IP}
      - HA_TOKEN=${HA_TOKEN}
      - EASEE_CHARGER_ID=${EASEE_CHARGER_ID}
      - EASEE_CARPORT_ID=${EASEE_CARPORT_ID}

  ####################################################################
  # Webdashboard: ny dator-/surfplatte-dashboard (EnergyWizard Open Fas A-F),
  # ersätter smartdashboard stegvis. profiles gör den valfri att starta - en
  # vanlig "docker compose up -d" (utan --profile) rör den inte alls, så den
  # kan utvecklas/testas utan att påverka den körande produktionen.
  ####################################################################
  webdashboard:
    build: ./webdashboard
    labels:
      - com.centurylinklabs.watchtower.enable=true
    container_name: webdashboard
    restart: unless-stopped
    profiles: ["webdashboard"]
    env_file:
      - ${DASHBOARD_ENV_PATH:-./secrets/dashboard.env}
    ports:
      - "8503:8503"
    volumes:
      - ./smartbox:/smartbox:ro
    depends_on:
      postgres-smartbox:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=postgres-smartbox
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - HA_IP=${HA_IP}
      - HA_TOKEN=${HA_TOKEN}
      # System-sidan frågar Watchtowers HTTP-API om nya versioner finns för ALLA
      # containrar på NUC:en - watchtower delar docker-nät med den här stacken.
      - WATCHTOWER_API_TOKEN=${WATCHTOWER_API_TOKEN}
      - WATCHTOWER_URL=http://watchtower:8080

  ####################################################################
  # HA-gateway: valfri reverse-proxy som slår ihop EnergyWizard (/energywizard,
  # /energywizard/mobil, /tablet) med din befintliga Home Assistant under SAMMA
  # adress/port. Bara för Container-installationer UTAN Supervisor - har du
  # Home Assistant OS/Supervised, använd HA:s egen Ingress istället (enklare,
  # säkrare, HA hanterar auth åt dig). Se kunskapsbanken för hela guiden,
  # inklusive varför själva portbytet på din RIKTIGA HA alltid görs manuellt
  # av dig i HA:s Inställningar - den här tjänsten rör aldrig HA:s egen config.
  # "docker compose --profile ha-gateway up -d" - rörs annars inte alls.
  ####################################################################
  ha-gateway:
    image: nginx:alpine
    container_name: ha-gateway
    restart: unless-stopped
    profiles: ["ha-gateway"]
    ports:
      - "${HA_GATEWAY_PORT:-8199}:8199"
    volumes:
      - ./ha-gateway/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./ha-gateway/print-url.sh:/docker-entrypoint.d/99-print-url.sh:ro
      - ${HA_GATEWAY_CERT_DIR}:/certs:ro
    environment:
      - DOMAIN=${HA_GATEWAY_DOMAIN}
      - HA_HOST=${HA_GATEWAY_UPSTREAM_HOST}
      - HA_PORT=${HA_GATEWAY_UPSTREAM_PORT:-8123}
      - HA_PROTO=${HA_GATEWAY_UPSTREAM_PROTO:-https}
      - GATEWAY_PORT=${HA_GATEWAY_PORT:-8199}

volumes:
  postgres_data: