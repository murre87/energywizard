<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EnergyWizard-kort: förhandsvisning</title>
<style>
  body { margin:0; padding:20px; font-family:Roboto,system-ui,sans-serif; }
  body.dark { background:#111; --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --card-background-color:#1c1c1c; --divider-color:rgba(255,255,255,.12); --primary-color:#03a9f4; }
  body.light { background:#f2f2f2; --primary-text-color:#212121; --secondary-text-color:#727272; --card-background-color:#fff; --divider-color:rgba(0,0,0,.12); --primary-color:#03a9f4; }
  .wrap { max-width:420px; margin:0 auto 20px; }
  ha-card { display:block; background:var(--card-background-color); border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,.25); color:var(--primary-text-color); }
</style></head><body class="dark"><div class="wrap" id="w"></div>
<script src="energywizard-cards.js"></script>
<script>
const q = new URLSearchParams(location.search);
document.body.className = q.get("theme") === "light" ? "light" : "dark";
const now = Math.floor(Date.now() / 1000), start = now - (now % 900);
const slots = [];
for (let i = 0; i < 96; i++) {
  const t = start + i * 900, h = new Date(t * 1000).getHours() + new Date(t * 1000).getMinutes() / 60;
  const price = 1.1 + 1.6 * Math.max(0, Math.sin(((h - 5) / 17) * Math.PI)) + 0.6 * (h > 16 && h < 20 ? 1 : 0) + 0.05 * Math.sin(i);
  const sun = Math.max(0, Math.sin(((h - 8) / 8) * Math.PI)) * 3200;
  slots.push([t, +price.toFixed(3), +(price - 0.6).toFixed(3), price < 1.9 ? "C" : "E", Math.round(sun), h >= 1 && h < 5 ? 3.7 : 0, null]);
}
const flow = [
  { k: "sol", l: "Sol", i: "☀️", w: 1850, on: true, d: "1.9 kW", r: "source" },
  { k: "nat", l: "Elnät", i: "🔌", w: 2100, on: true, d: "Köper 2.1 kW", r: "grid" },
  { k: "hus", l: "Hemmet", i: "🏠", w: 3950, on: true, d: "4.0 kW", r: "hub" },
  { k: "varmepump", l: "Värmepump", i: "🌡️", w: 1700, on: true, d: "Går · inne 21.4 °C", r: "load" },
  { k: "varmvatten", l: "Varmvatten", i: "💧", w: null, on: false, d: "60 °C", r: "load" },
  { k: "spabad", l: "Spabad", i: "🛁", w: 180, on: false, d: "38.5 °C", r: "load" },
  { k: "ev_nissan", l: "Nissan Leaf", i: "🚗", w: 0, on: false, d: "Laddar inte · 64 %", r: "load" },
  { k: "ev_tesla", l: "Tesla Model Y", i: "🚗", w: 2100, on: true, d: "Laddar 2.1 kW · 52 %", r: "load" },
];
const cur = slots[0];
const attrs = { v: 1, ts: new Date().toISOString(), unit: q.get("unit") || "kr", flow: q.get("empty") ? [] : flow,
  why: { varmepump: "Rumsåterkoppling sätter börvärdet till 18.0 °C. ML: lägsta börvärde som håller de två kallaste rummen över 20.7 °C.", ev_tesla: "Laddar enligt schema." },
  slots: q.get("empty") ? [] : slots, cars: [{ id: "nissan", name: "Nissan Leaf" }, { id: "tesla", name: "Tesla Model Y" }],
  price: { now: cur[1], spot: cur[2], mode: cur[3] }, battery: false,
  eco: q.get("empty") ? null : {
    today: { buy_kwh: 12.4, buy: 28.4, buy_avg: 2.29, sell_kwh: 3.1, sell: 1.86, sell_avg: 0.6, net: 26.54, saved: 4.2, pct: 13.1, bat: q.get("nobat") ? null : 1.8 },
    week: { buy_kwh: 86.2, buy: 210.5, buy_avg: 2.44, sell_kwh: 18, sell: 9.4, sell_avg: 0.52, net: 201.1, saved: 31, pct: 12, bat: q.get("nobat") ? null : 8.5 },
    month: { buy_kwh: null, buy: null, buy_avg: null, sell_kwh: null, sell: null, sell_avg: null, net: null, saved: null, pct: null, bat: null },
  },
  heat: { indoor: 21.4, target: 20, setpoint: 21, outdoor: -2, water: 59, water_set: 60, mode: cur[3], cop: 3.3, floor: 20.5, cheap: 22.5, max: 22, min: 19 } };
const win = (a, b, k) => [start + a * 900, start + b * 900, k];
attrs.cars = [{ id: "nissan", name: "Nissan Leaf", soc: 64, w: 0, on: false, win: [win(48, 56, 3.7)] },
              { id: "tesla", name: "Tesla Model Y", soc: 52, w: 2100, on: true, win: [win(0, 4, 2.1), win(52, 60, 7.4)] }];
const kind = q.get("card");
const tag = kind === "heat" ? "energywizard-heat-card"
  : kind === "car" ? "energywizard-car-card"
  : kind === "economy" ? "energywizard-economy-card"
  : "energywizard-house-card";
const el = document.createElement(tag); el.id = "c"; document.getElementById("w").appendChild(el);
el.setConfig({ tab: q.get("tab") || "now", language: q.get("lang") || "sv", title: q.get("title") || undefined, period: q.get("period") || undefined });
const states = q.get("missing") ? {} : { "sensor.energywizard_kort": { state: "billigt", last_updated: "x", attributes: attrs } };
if (!q.get("missing") && q.get("controls") !== "0") {
  const opts = ["Auto", "Ladda nu", "Pausa"];
  states["select.energywizard_ev_nissan_mode"] = { state: "Auto", attributes: { options: opts } };
  states["select.energywizard_ev_tesla_mode"] = { state: "Ladda nu", attributes: { options: opts } };
}
el.hass = { language: q.get("lang") || "sv", states, callService: (d, s, data) => console.log("callService", d, s, JSON.stringify(data)) };
</script></body></html>
