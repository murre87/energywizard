name: numpy-compatibility-evaluation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/numpy-compat.yml
      - tests/numpy_compat/**
      - scripts/check_numpy_compat.py
      - scripts/check_numpy_native.py
      - smartbox/requirements.txt
permissions:
  contents: read
jobs:
  legacy-cpu:
    strategy:
      fail-fast: false
      matrix:
        target: [candidate, candidate-openblas]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.target == 'candidate'
        run: python3 scripts/check_numpy_compat.py
      - if: matrix.target == 'candidate-openblas'
        run: python3 scripts/check_numpy_compat.py --candidate-target candidate-openblas --record-experimental-rejection numpy-legacy-openblas.json
      - if: matrix.target == 'candidate-openblas'
        name: Strict Intel-v1 and AMD-with-3DNow controls
        run: |
          python3 scripts/check_numpy_compat.py --candidate-target candidate-openblas --cpu-model intel-v1 --output numpy-legacy-intel-v1.json
          python3 scripts/check_numpy_compat.py --candidate-target candidate-openblas --cpu-model amd-3dnow --output numpy-legacy-amd-3dnow.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.target == 'candidate-openblas'
        with:
          name: numpy-legacy-openblas
          path: numpy-legacy-*.json
          retention-days: 14
          if-no-files-found: error
  native-stack:
    strategy:
      fail-fast: false
      matrix:
        target: [candidate, candidate-openblas]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Numerical checks and native timing comparison
        run: python3 scripts/check_numpy_native.py --candidate-target ${{ matrix.target }} --output numpy-native-report.json
      - uses: ./.github/actions/audit-image
        with:
          image: ew-numpy-native-${{ matrix.target }}
          report-name: numpy-${{ matrix.target }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: numpy-native-${{ matrix.target }}-${{ matrix.arch }}
          path: numpy-native-report.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove evaluation image tags
        if: always()
        run: docker image rm -f ew-numpy-native-capped ew-numpy-native-${{ matrix.target }} || true
