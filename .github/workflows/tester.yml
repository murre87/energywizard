# Kör testerna mot en riktig Postgres: syntax i alla Python-filer, planeringen över sommartid/normaltid och effektvakten.
# Bilderna byggs inte om något här går sönder (se docker.yml).
name: tester
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smartbox/requirements.txt
      - run: pip install -r smartbox/requirements.txt pytest
      - run: python -m pytest -q
