# Kör testerna först, och bygger sedan de tre bilderna (privata) på GitHub Container Registry vid varje push till main.
# Går ett test sönder byggs ingen ny bild, så Watchtower hämtar aldrig trasig kod.
# Servern hämtar dem med Watchtower, så en ny version kommer av sig själv.
name: bilder
on:
  push:
    branches: [main]
    # Bara dokumentation/sajt ändrad (t.ex. Buy Me a Coffee-listan i README varje natt) -> inga nya
    # bilder, så Watchtower inte startar om huset i onödan.
    paths-ignore: ["README.md", "README.en.md", "ROADMAP.md", "docs/**"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  tester:
    uses: ./.github/workflows/tester.yml

  bygg:
    needs: tester
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [ewapp, smartbox, webdashboard]   # smartdashboard (Streamlit) borttagen 2026-11-07
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.app }}
          build-args: |
            APP_VERSION=1.${{ github.run_number }}
          push: true
          tags: |
            ghcr.io/murre87/energywizard-${{ matrix.app }}:latest
            ghcr.io/murre87/energywizard-${{ matrix.app }}:${{ github.sha }}

  # Allt i en bild (motor, databas, webben och mobilappen), samma som HA-tillägget. Fristående:
  #   docker run -d -p 8503:8503 -p 8502:8502 -v energywizard:/data ghcr.io/murre87/energywizard
  # och sedan startguiden i webben. Se compose.yml och install.sh.
  allt-i-ett:
    needs: tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./ha-addon/smartbox
          platforms: linux/amd64,linux/arm64
          build-args: |
            ENERGYWIZARD_REF=main
            ENERGYWIZARD_COMMIT=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/murre87/energywizard:latest
            ghcr.io/murre87/energywizard:${{ github.sha }}
          cache-from: type=gha,scope=allt-i-ett
          cache-to: type=gha,mode=max,scope=allt-i-ett
          # Bara de två plattformarna i manifestet (inga attesteringsposter "unknown/unknown") - Home Assistant
          # Supervisor hämtar den här bilden som tillägget (se jobbet tillagg nedan).
          provenance: false
          sbom: false

  # HA-tillägget som FÄRDIG bild (2026-11-06): config.yaml pekar på ghcr.io/murre87/energywizard och Supervisor
  # hämtar <bild>:<version> i stället för att bygga själv (tog lång tid och kunde misslyckas på svaga maskiner).
  # Versionen höjs HÄR, efter att bilden finns: överst i CHANGELOG.md står nästa version ("## 1.2.17 (...)"). Är den
  # nyare än config.yaml taggas den nyss byggda bilden med versionsnumret och först därefter skrivs versionen in i
  # config.yaml - så ser ingen användare en uppdatering vars bild inte finns än. Versionstaggar skrivs aldrig om.
  tillagg:
    needs: allt-i-ett
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: tillagg-version
      cancel-in-progress: false
    steps:
      # Senaste main (inte den byggda commiten): när två körningar överlappar ska versionshöjningen göras ovanpå den
      # andras (2026-11-06: 1.2.27 fick rebase-konflikt mot 1.2.26 och tappades tyst)
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tagga bilden med tilläggets version och höj versionen i config.yaml
        run: |
          set -eu
          IMG=ghcr.io/murre87/energywizard
          # Versionen som den HÄR körningens bild hör till: CHANGELOG i den byggda commiten
          git show "${{ github.sha }}:ha-addon/smartbox/CHANGELOG.md" > /tmp/changelog.md
          NEW=$(python3 ha-addon/smartbox/addon_version.py changelog /tmp/changelog.md)
          echo "Bildens version: $NEW"
          if docker buildx imagetools inspect "$IMG:$NEW" >/dev/null 2>&1; then
            echo "$IMG:$NEW finns redan - skrivs inte om"
          else
            docker buildx imagetools create -t "$IMG:$NEW" "$IMG:${{ github.sha }}"
          fi
          docker buildx imagetools inspect "$IMG:$NEW" | grep -q "linux/arm64"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            CUR=$(python3 ha-addon/smartbox/addon_version.py config)
            if ! python3 ha-addon/smartbox/addon_version.py newer "$NEW" "$CUR"; then
              echo "config.yaml har redan $CUR (>= $NEW) - inget att höja"; exit 0
            fi
            python3 ha-addon/smartbox/addon_version.py set "$NEW" "$IMG"
            git commit -qam "Tillägg $NEW: färdig bild publicerad ($IMG:$NEW)"
            if git push -q origin HEAD:main; then echo "config.yaml höjd till $NEW"; exit 0; fi
            sleep $((2 ** i))
          done
          echo "Kunde inte höja config.yaml till $NEW"; exit 1
