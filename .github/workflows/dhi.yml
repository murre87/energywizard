name: dhi-verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/dhi.yml
      - scripts/verify_dhi_*.py
      - scripts/audit_dhi_images.py
      - scripts/audit_image.py
      - tests/test_dhi_*.py
      - smartbox/Dockerfile.dhi
      - smartbox/requirements.txt
      - webdashboard/Dockerfile.dhi
      - ewapp/Dockerfile.dhi
      - telemetry-collector/Dockerfile.dhi
permissions:
  contents: read
jobs:
  signatures:
    # Never expose the registry credential to fork code; do not use pull_request_target.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate to DHI
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ vars.DHI_USERNAME }}
          password: ${{ secrets.DHI_IO }}
      - name: Authenticate Scout to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DHI_USERNAME }}
          password: ${{ secrets.DHI_IO }}
      - name: Install checksum-pinned Scout
        run: |
          mkdir -p "$RUNNER_TEMP/scout"
          curl --fail --silent --show-error --location \
            https://github.com/docker/scout-cli/releases/download/v1.29.0/docker-scout_1.29.0_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/scout.tar.gz"
          echo "9157cdc9372b478a8cd51dd53f5e9c74a7e34056ea291c65520bf76016fa72f4  $RUNNER_TEMP/scout.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/scout.tar.gz" -C "$RUNNER_TEMP/scout" --no-same-owner docker-scout
          echo "$RUNNER_TEMP/scout" >> "$GITHUB_PATH"
      - name: Verify both pinned bases and architectures
        run: python3 scripts/verify_dhi_vex.py --output "$RUNNER_TEMP/dhi-vex"
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dhi-signatures
          path: |
            ${{ runner.temp }}/dhi-vex/*.json
            ${{ runner.temp }}/dhi-vex/*.log
            ${{ runner.temp }}/dhi-vex/*.pub
          if-no-files-found: warn
          retention-days: 14
  runtime:
    needs: signatures
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate to DHI
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ vars.DHI_USERNAME }}
          password: ${{ secrets.DHI_IO }}
      - name: Verify service startup, dependencies and owned volumes
        env:
          DHI_ARCH: ${{ matrix.arch }}
        run: python3 scripts/verify_dhi_runtime.py --platform "linux/$DHI_ARCH" --output "$RUNNER_TEMP/dhi-runtime/$DHI_ARCH.json"
      - name: Audit the exact tested optional images
        env:
          DHI_ARCH: ${{ matrix.arch }}
        run: |
          python3 -m venv "$RUNNER_TEMP/dhi-audit-venv"
          "$RUNNER_TEMP/dhi-audit-venv/bin/python" -m pip --disable-pip-version-check install pip-audit==2.10.1
          "$RUNNER_TEMP/dhi-audit-venv/bin/python" scripts/audit_dhi_images.py \
            --runtime-results "$RUNNER_TEMP/dhi-runtime/$DHI_ARCH.json" \
            --platform "linux/$DHI_ARCH" --output "$RUNNER_TEMP/dhi-audit/$DHI_ARCH"
      - name: Retain runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dhi-runtime-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/dhi-runtime/*.json
            ${{ runner.temp }}/dhi-runtime/*.log
            ${{ runner.temp }}/dhi-audit/**/*.json
            ${{ runner.temp }}/dhi-audit/**/requirements.txt
          if-no-files-found: warn
          retention-days: 14
