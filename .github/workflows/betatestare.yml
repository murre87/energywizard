name: betatestare
# Emils regel 2026-11-10: betatestar-ärenden stängs direkt om de inte rapporterar ett fel. Mallen
# .github/ISSUE_TEMPLATE/4-betatestare.yml frågar "Har du stött på något fel?"; svaret "Nej" ger ett tack
# (med sponsringsraden, så att det blir ett enda svar) och ärendet stängs. "Ja" lämnas öppet.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  stang:
    if: github.event.issue.user.type != 'Bot' && github.event.issue.user.login != 'murre87'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";
            const isBeta = (issue.labels || []).some((l) => l.name === "betatestare") ||
              /^\s*(betatestare|beta[\s-]?test(er|are)?)\b/i.test(issue.title || "");
            if (!isBeta) return;
            const m = body.match(/Har du stött på något fel\?[^\n]*\n+([^\n]+)/);
            if (m) {                                   // från mallen: svaret avgör
              if (!/^Nej/.test(m[1].trim())) return;   // fel rapporterat: lämnas öppet
            } else {                                   // utan mallen (gamla länkar, tomt ärende): stäng om inget fel nämns
              const fel = /(\bfel\b|fungerar inte|funkar inte|kraschar|krasch|hittas inte|identifi|identify|wrong|felaktig|som batteri|as battery|error|bug|crash|doesn.?t work|not work|not identif|not found|fails?|broken)/i;
              if (fel.test(`${issue.title}\n${body}`)) return;
            }
            const prose = body.replace(/###[^\n]*\n/g, " ");
            const words = (list) => (prose.match(new RegExp(`(?<!\\p{L})(${list})(?!\\p{L})`, "giu")) || []).length;
            const sv = words("och|jag|har|med|inte|värmepump|det|är|att|som|på|till|kan|vi|min|mitt|tack|solceller|elbil");
            const en = words("the|and|with|have|my|is|for|which|it|to|of|can|this|that|not|solar|heat|pump|car");
            const text = sv >= en
              ? `Tack för att du är med som betatestare! Eftersom du inte rapporterar något fel stänger vi ärendet, så att listan bara innehåller det som behöver rättas.\n\n` +
                `Stöter du på något som inte fungerar: skapa ett nytt ärende med mallen *Något fungerar inte*, gärna med loggen bifogad (Inställningar → Logg → *Ladda ner 2 dygn*).\n\n` +
                `EnergyWizard är gratis. Vill och kan du bidra till utvecklingen finns sponsring här: https://github.com/sponsors/murre87 – ingen press.`
              : `Thanks for joining as a beta tester! As you are not reporting a problem we close this issue, so the list only holds things that need fixing.\n\n` +
                `If something does not work, open a new issue with the *Something doesn't work* template, ideally with the log attached (Settings → Log → *Download 2 days*).\n\n` +
                `EnergyWizard is free. If you would like to support the development: https://github.com/sponsors/murre87 – no pressure.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: text });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: "closed", state_reason: "completed" });
