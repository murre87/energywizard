name: Audit exact built image
description: Reject Python advisories, CISA KEVs and available Debian security fixes
inputs:
  image:
    description: Locally loaded image to audit
    required: true
  report-name:
    description: Unique artifact name for this image
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11.18"
    - name: Install audit tooling
      shell: bash
      run: |
        python -m pip --disable-pip-version-check install --upgrade pip==26.3 setuptools==84.2.1 wheel==0.46.3
        python -m pip --disable-pip-version-check install pip-audit==2.10.1
    - name: Audit installed packages and CISA KEVs
      shell: bash
      env:
        EW_AUDIT_IMAGE: ${{ inputs.image }}
        EW_AUDIT_SCRIPT: ${{ github.action_path }}/../../../scripts/audit_image.py
      run: python "$EW_AUDIT_SCRIPT" "$EW_AUDIT_IMAGE" --output "$RUNNER_TEMP/image-audit"
    - name: Retain complete findings and feed evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.report-name }}
        path: |
          ${{ runner.temp }}/image-audit/*.json
          ${{ runner.temp }}/image-audit/requirements.txt
        if-no-files-found: warn
        retention-days: 14
