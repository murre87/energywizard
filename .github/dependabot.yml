version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /smartbox
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directories: [/smartbox, /webdashboard, /ewapp, /telemetry-collector, /ha-addon/smartbox]
    schedule: {interval: weekly}
    # Optional DHI builds need separate Dependabot registry credentials first.
    exclude-paths: ["**/Dockerfile.dhi"]
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
