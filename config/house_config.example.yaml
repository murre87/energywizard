# house_config.yaml - en per installation. Kopiera denna fil, döp om till house_config.yaml
# (eller peka ut en egen sökväg), och fyll i det du faktiskt har. Allt nedan är valfritt -
# en helt tom fil (bara house_id) är ett giltigt, testat tillstånd: alla delsystem blir Null-
# drivrutiner och systemet kör vidare utan dem.
#
# Varje enskild entitet under en drivrutin är ÄVEN DEN valfri - har du t.ex. ett spa men
# saknar effekt-/säkerhetssensorerna, utelämna bara de nycklarna. Resten av systemet
# behandlar saknade värden som None, inte som fel.

house_id: "mitt-hus"   # fri text, används bara i loggar/UI

# --- Elbilar (0 eller flera) ---
evs: []
# evs:
#   - id: min_bil                    # fri sträng, används som nyckel i scheman/loggar
#     driver: generic_ev             # generic_ev funkar för praktiskt taget alla märken
#     battery_kwh: 60
#     entities:
#       soc: sensor.min_bil_batteri        # valfri - saknas den, mata in SOC manuellt i appen istället
#       plugged_in: binary_sensor.min_bil_kabel
#       climate: climate.min_bil            # valfri
#     charger:
#       id: min_laddare
#       driver: generic_charger      # eller t.ex. easee om du har en Easee-box
#       phases: 1                    # 1, 3, eller "auto" om laddaren kan fasväxla
#       entities:
#         status: sensor.min_laddare_status
#         current_a: sensor.min_laddare_strom

# --- Värmepump (valfri) ---
heat_pump:
  enabled: false
# heat_pump:
#   enabled: true
#   driver: thermia_husdata          # eller t.ex. nibe_modbus (kräver egen research/drivrutin)
#   connection:
#     modbus_host: 192.168.1.50
#     modbus_port: 502
#     unit_id: 1
#
# Panasonic Aquarea via HeishaMon (lokalt, HTTP). Kurvförskjutning (±5) och tidsbegränsad paus stöds;
# rumsbörvärde finns inte - pumpen styr på kurva. Aldrig provad mot en riktig pump.
# heat_pump:
#   enabled: true
#   driver: heishamon
#   host: 192.168.1.60
#   base_shift: 0            # din vanliga förskjutning i kurvläge; nollställs hit vid varje start
#   indoor_from_z1: false    # true om zon 1 har rumsgivare (då blir Z1_Temp innetemperatur)
#
# NIBE S-serie, lokalt REST-API (meny 7.5.15). Börja med enbart läsning.
# Lösenord och certifikatets SHA-256-pin sätts i NIBE_LOCAL_* (se .env.example).
# Sensorer för S1155/S1255 mappas mot enhetens registermetadata. Andra modeller
# och skrivningar kräver egna verifierade points-bindningar: docs/nibe-local-rest.md.
# heat_pump:
#   enabled: true
#   driver: nibe_local
#   control_enabled: false
#   connection:
#     host: 192.0.2.10
#     port: 8443
#     device_index: 0
#     expected_product: "NIBE S1255"  # ersätt med exakt upptäckt produktnamn
#     # Rapporterar pumpen tomt produktnamn (vissa S1255): välj registerkartan med model
#     # och lås identiteten med serienumret i stället för expected_product.
#     # model: "S1255"
#     # expected_serial: "06xxxxxxxxxxxx"

# --- Solceller (valfri) ---
solar:
  enabled: false
# Välj EN av varianterna nedan. Entitetsväljaren (webdashboard -> Inställningar) fyller
# i det mesta själv. Se docs/kunskapsbank/vaxelriktare.html för vilken integration som gäller.
#
# SolarEdge (egen drivrutin):
# solar:
#   enabled: true
#   driver: solaredge
#
# Växelriktare med en exportgräns i PROCENT som HA-entitet (t.ex. Growatt via
# 0xAHA/Growatt_ModbusTCP, "Export Limit Power"):
# solar:
#   enabled: true
#   driver: generic_number
#   entities:
#     pv_power_w: sensor.min_vaxelriktare_effekt
#     today_kwh: sensor.min_vaxelriktare_idag
#     export_limit_pct: number.min_vaxelriktare_export_limit_power
#
# Exportgräns i WATT (t.ex. Sungrow via mkaiser/Sungrow-SHx-Inverter-Modbus-Home-Assistant):
# solar:
#   enabled: true
#   driver: generic_number
#   entities:
#     pv_power_w: sensor.total_dc_power
#     today_kwh: sensor.daily_pv_generation
#     export_limit_w: number.export_power_limit
#     export_limit_switch: switch.export_power_limit   # gränsläget - slås på/av automatiskt
#     export_limit_max_w: 10000                        # valfri; annars entitetens eget max
#
# Huawei SUN2000 via wlcrs/huawei_solar (styrs via integrationens tjänster):
# solar:
#   enabled: true
#   driver: huawei_solar
#   entities:
#     pv_power_w: sensor.inverter_input_power
#     today_kwh: sensor.inverter_daily_yield
#     device_id: 0123abcd...      # växelriktarens enhets-ID (eller EMMA:ns om du har en)
#
# Fronius (eller annan) via HA:s inbyggda Modbus - kräver en modbus-hubb i configuration.yaml:
# solar:
#   enabled: true
#   driver: modbus_register
#   entities:
#     pv_power_w: sensor.solarnet_power_photovoltaics
#   modbus:
#     preset: fronius             # WMaxLimPct 40232 / WMaxLim_Ena 40236, OVERIFIERAT - se dokumentationen
#     hub: fronius                # namnet på din modbus-hubb
#     slave: 1

# --- Spa (valfri) ---
spa:
  enabled: false
# spa:
#   enabled: true
#   driver: generic_spa              # eller t.ex. gecko / balboa
#   entities:
#     current_temp: sensor.mitt_spa_temperatur    # valfri
#     target_temp: sensor.mitt_spa_maltemp         # valfri
#     power_w: sensor.mitt_spa_effekt              # valfri - utelämna om du saknar en effektsensor
#
# Spabad vars värmare sitter på ett relä, t.ex. en Shelly. EnergyWizard blir termostaten:
# på under målet, av vid målet, högst ett byte per 5 min och aldrig över 40 °C.
# spa:
#   enabled: true
#   driver: switch                     # eller "shelly", samma sak
#   entities:
#     heater_switch: switch.shelly_spa           # krävs
#     temperature: sensor.spa_vattentemperatur   # rekommenderas (Shelly Add-on + DS18B20)
#     power: sensor.shelly_spa_power             # valfri

# --- Husbatteri (valfri) ---
# Ferroamp EnergyHub: driver: ferroamp_modbus läser lokalt via Modbus TCP.
# Komplett exempel och jämförelse: docs/ferroamp-energyhub.md.
# Batteri: control: styr + default_mode_verified: true krävs för skrivning.
# Sol/export: control_enabled: true krävs separat. Kontrollera firmware innan styrning.
# battery:
#   enabled: true
#   driver: generic
#   capacity_kwh: 10
#   control: samarbete             # samarbete = läs bara (BESS/Predbat styr) | styr | av
#   reserve_soc: 20                # sparas alltid till strömavbrott (%)
#   priority_soc: 50               # över detta får elbilen solöverskottet före batteriet (%)
#   max_power_w: 5000              # max ladd-/urladdningseffekt (W), för dygnsplanen
#   efficiency: 0.9                # verkningsgrad tur och retur
#   cycle_cost: 0.30               # slitage, kr per urladdad kWh (cellernas pris / (kapacitet x cykler))
#   charge_wear_cost_sek_per_kwh: 0.0    # extra slitage, kr per kWh lagrad energi
#   discharge_wear_cost_sek_per_kwh: 0.0 # extra utöver cycle_cost, kr per kWh uttagen lagrad energi
#   reversal_cost_sek: 0.0         # extra kr per fysisk riktningsändring, även via vila
#   min_change_minutes: 5         # minsta tid mellan kommandobyten (minst 5); t.ex. 30
#   plan: true                     # dygnsplan i läget styr (false = bara reglerna)
#   entities:
#     soc: sensor.batteri_soc
#     power: sensor.batteri_effekt               # + = laddar
#     mode_select: select.batteriets_lage        # krävs för 'styr'
#   modes:                         # krävs för 'styr' - exakt batteriets egna alternativ i HA
#     auto: "Self-use"
#     hold: "..."
#     charge: "..."
#     discharge: "..."

# --- Elmätare (rekommenderas) ---
# Behövs för effektvakten, säkringsskyddet och solladdningen. Utan den här sektionen letar
# EnergyWizard upp en Tibber Pulse automatiskt. Välj EN av formerna:
# power_meter:
#   driver: tibber_pulse            # spänning + ström per fas (bäst: ger säkringsskyddet fasströmmar)
#   entities:
#     voltage_l1: sensor.tibber_pulse_hemma_spanning_fas1
#     voltage_l2: sensor.tibber_pulse_hemma_spanning_fas2
#     voltage_l3: sensor.tibber_pulse_hemma_spanning_fas3
#     current_l1: sensor.tibber_pulse_hemma_strom_fas1
#     current_l2: sensor.tibber_pulse_hemma_strom_fas2
#     current_l3: sensor.tibber_pulse_hemma_strom_fas3
#     hour_kwh: sensor.tibber_pulse_hemma_ackumulerad_forbrukning_under_aktuell_timme   # valfri
#
# power_meter:
#   driver: power_w                 # en sensor med nettoeffekt (+ köper, - säljer)
#   power_w_invert: false           # true om mätaren visar EXPORT som positivt
#   entities:
#     power_w: sensor.min_elmatare_effekt
#     current_l1: sensor.min_elmatare_strom_l1      # valfritt, men ger säkringsskyddet riktiga värden
#
# power_meter:
#   driver: import_export           # P1/HAN-mätare med separata sensorer
#   entities:
#     import_w: sensor.p1_power_consumed
#     export_w: sensor.p1_power_produced

# --- Huvudsäkring ---
fuse:
  main_fuse_a: 25
