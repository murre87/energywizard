# Emils hus (Malmgatan 34) - referenskonfigurationen. Transkriberad från de hårdkodade
# konstanterna/entitets-dictarna i smartbox/homeassistant.py, smartbox/decisions.py och
# smartbox/pump.py. Drivrutinerna (Fas 1) kan nu instansieras riktigt från den här filen
# (se tests/test_config_loader.py), men main.py/gpm.py:s faktiska styrning använder dem
# ännu inte - det är Fas 2-3.

house_id: "malmgatan-34"

evs:
  # Allt bilen och laddboxen använder står här (2026-11-04) - motorn och mobilappen har inga bilnamn eller
  # entiteter inbyggda. Startguiden fyller i samma fält åt nya användare.
  - id: nissan
    name: Nissan Leaf
    ha_name: leaf                      # HA-sensorn heter sensor.smartbox_leaf_batteri (som förut)
    notify: [owner]                    # vilka användares telefoner som får bilens aviseringar (tomt = alla)
    driver: nissan
    battery_kwh: 40
    entities:
      soc: sensor.leaf_battery_level
      plugged_in: binary_sensor.leaf_plugged_in
      climate: climate.leaf_climate
      inside_temp: sensor.leaf_internal_temperature
      tracker: device_tracker.leaf_location
      update_button: button.leaf_update_data     # Leaf-integrationen hämtar nytt batterivärde bara när vi ber om det
      refresh_button: button.leaf_update_data
      flash_button: button.leaf_flash_lights
      horn_button: button.leaf_honk_horn
      start_charge_button: button.leaf_start_charge
      range: sensor.leaf_range_ac_off
      daily_distance: sensor.leaf_daily_distance
    charger:
      driver: easee
      id: EHLS9NVL                     # laddboxens serienummer (Easee-integrationens tjänster)
      phases: 1                        # Nissan Leaf 2018: endast 1-fas
      max_a: 20                        # högsta laddström (A)
      enable_switch: switch.easee_lite_laddboxen_aktiverad
      entities:
        # 2026-11-07: bara entiteter som finns. Fasströmmarna läses ur ström-sensorns attribut (state_inCurrentT3-T5).
        power_kw: sensor.easee_lite_effekt
        current_a: sensor.easee_lite_strom
        session_kwh: sensor.easee_lite_energi_laddningssession
        lifetime_kwh: sensor.easee_lite_livstidsforbrukning
        status: sensor.easee_lite_status
        online: binary_sensor.easee_lite_online

  - id: tesla
    name: Tesla Model Y
    notify: [owner, elin]
    driver: tesla
    battery_kwh: 75
    entities:
      soc: sensor.tesla_model_y_battery
      plugged_in: binary_sensor.tesla_model_y_charger
      charging: binary_sensor.tesla_model_y_charging
      charging_state: sensor.tesla_model_y_charging_state
      climate: climate.tesla_model_y_hvac_climate_system
      shift_state: sensor.tesla_model_y_shift_state   # P/D/R/N - värmen räknas inte som förvärmning under körning
      inside_temp: sensor.tesla_model_y_temperature_inside
      tracker: device_tracker.tesla_model_y_location_tracker
      wake_button: button.tesla_model_y_wake_up  # väcks när den är inkopplad men batterivärdet är gammalt
      refresh_button: button.tesla_model_y_force_data_update
      flash_button: button.tesla_model_y_flash_lights
      horn_button: button.tesla_model_y_horn
      destination_tracker: device_tracker.tesla_model_y_destination_location_tracker
      lock: lock.tesla_model_y_doors
      trunk: cover.tesla_model_y_trunk
      frunk: cover.tesla_model_y_frunk
      range: sensor.tesla_model_y_range
      outside_temp: sensor.tesla_model_y_temperature_outside
      tpms: [sensor.tesla_model_y_tpms_front_left, sensor.tesla_model_y_tpms_front_right, sensor.tesla_model_y_tpms_rear_left, sensor.tesla_model_y_tpms_rear_right]
      arrival_time: sensor.tesla_model_y_arrival_time
      distance_to_arrival: sensor.tesla_model_y_distance_to_arrival
    charger:
      driver: easee
      id: EHLU7JCT                     # laddboxens serienummer (Easee-integrationens tjänster)
      phases: auto                     # kan fasväxla 1<->3
      max_a: 16                        # högsta laddström (A)
      enable_switch: switch.carport_laddare_aktiverad
      entities:
        power_kw: sensor.carport_effekt
        current_a: sensor.carport_strom
        session_kwh: sensor.carport_energi_laddningssession
        lifetime_kwh: sensor.carport_livstidsforbrukning
        status: sensor.carport_status
        online: binary_sensor.carport_online

heat_pump:
  enabled: true
  driver: thermia_husdata              # Thermia Diplomat Optimum G3 via Husdata H66-gateway
  connection:
    modbus_port: 502
    unit_id: 1
    # modbus_host sätts via PUMP_IP i .env, inte här (driftsspecifikt, inte topologi)

solar:
  enabled: true
  driver: solaredge
  entities:
    # Modbus (snabb) först, molnet (var 15:e min) som reserv
    pv_power_w: [sensor.solaredge_i1_ac_power, sensor.solaredge_aktuell_effekt]
    today_kwh: sensor.solaredge_el_i_dag
  curtailment:
    mode: solaredge_modbus_proprietary
    entity: number.solaredge_modbus_active_power_limit

appliances:            # hushållsmaskiner som ger en "startad"-notis (Inställningar -> Notiser -> Övrigt)
  - name: Tvättmaskinen
    entity: sensor.tvattmaskin

weather_entity: weather.malmgatan_34   # väderprognosen i appens hälsning (annars första weather.* i HA)

spa:
  enabled: true
  driver: gecko
  entities:
    current_temp: sensor.spa_malmgatan_34_current_temperature
    target_temp: sensor.spa_malmgatan_34_target_temperature
    climate: climate.spabad_heater
    water_heater: water_heater.spa_malmgatan_34_heater
    economy_mode: switch.spabad_economy_mode
    power_phases: [sensor.spabad_phase_a_effekt, sensor.spabad_phase_b_effekt, sensor.spabad_phase_c_effekt]
    power_w: sensor.spabad_pahsemeter_effekt   # används om fassensorerna saknas; beloppet tas (CT-klämmans riktning)
    smart_plug: switch.shelly2
    error: sensor.spa_malmgatan_34_error_s   # felkod som visas i appen
    safety:
      overcurrent: binary_sensor.shelly2_overstrom
      overvoltage: binary_sensor.shelly2_overspanning
      overheated: binary_sensor.shelly2_overhettad
      power_exceeded: binary_sensor.shelly2_effekt_overskrids
    activities:
      heating: binary_sensor.spa_malmgatan_34_heating
      circ_pump: binary_sensor.spabad_circulating_pump
      pump1: fan.spabad_pump_1
      blower: fan.spa_malmgatan_34_blower
      waterfall: fan.spabad_waterfall
      lights: light.spabad_lights
      ozone: binary_sensor.spabad_ozone

power_meter:
  driver: tibber_pulse
  entities:
    voltage_l1: sensor.tibber_pulse_malmgatan_34_spanning_fas1
    voltage_l2: sensor.tibber_pulse_malmgatan_34_spanning_fas2
    voltage_l3: sensor.tibber_pulse_malmgatan_34_spanning_fas3
    current_l1: sensor.tibber_pulse_malmgatan_34_strom_fas1
    current_l2: sensor.tibber_pulse_malmgatan_34_strom_fas2
    current_l3: sensor.tibber_pulse_malmgatan_34_strom_fas3
    hour_kwh: sensor.tibber_pulse_malmgatan_34_ackumulerad_forbrukning_under_aktuell_timme

fuse:
  main_fuse_a: 25   # standardvärde (MAX_FUSE_A i decisions.py); överstyrs i drift av fuse_size_a i system_settings

# Laddplanen räknar med kyla (ev_heating.py, natanoj, 1.2.71) - påslaget 2026-11-13 (Emil)
ev_planning:
  heating_adjustment:
    enabled: true
    balance_temp_c: 10
    kw_per_degree: auto
    max_base_kw: 10
    window_days: 30
